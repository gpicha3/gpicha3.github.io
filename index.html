<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07040f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alpha">
  <meta name="description" content="รวมแอปส่วนตัว พร้อมสรุปและแจ้งเตือนจากทุกแอป">
  <title>Alpha</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <script src="/alpha-theme.js"></script>
  <link rel="preload" href="/assets/alpha-character.png" as="image">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <!-- หน้าแรก -->
  <main class="home" id="home">
    <div class="hud-top mono"><span class="live" id="liveState"><i></i><b>ALPHA · ONLINE</b></span><span class="hud-right"><span id="hudDate"></span>
      <button type="button" class="gear" id="settingsBtn" aria-label="ตั้งค่า"><svg viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="8.5" cy="17" r="2.5"/></svg></button></span></div>

    <a class="orb-btn" id="orbBtn" href="claude://claude.ai/project/01a1a61f-5150-74b6-b77b-14f320f89b67" aria-label="เปิด Alpha ใน Claude">
      <span class="alpha alpha-lg" id="alpha" aria-hidden="true"><i class="glow-orb"></i><i class="ring r1"></i><span class="char"><img src="/assets/alpha-character.png" alt="" draggable="false"><i class="shirt"></i></span><i class="ring r2"></i><i class="spark s1"></i><i class="spark s2"></i></span>
    </a>

    <header class="greet">
      <h1 id="greet">สวัสดี</h1>
      <button type="button" class="headline" id="headline" data-brief aria-label="ฟังสรุป">กำลังโหลด…</button>
    </header>

    <button type="button" class="log-pending" id="logPending" hidden></button>
    <section class="alerts" id="alerts" aria-live="polite"></section>
    <section class="apps" id="apps"></section>
  </main>

  <!-- จดรายรับรายจ่าย: การ์ดยืนยัน · แถบเลิกทำ · รายการรอส่ง -->
  <div class="log-layer" id="logCard" hidden></div>
  <div class="log-undo glass" id="logUndo" hidden><span id="logUndoText"></span><button type="button" id="logUndoBtn">เลิกทำ</button></div>
  <section class="overlay log-queue" id="logQueue" aria-label="รายการรอส่ง" hidden>
    <header class="rp-head">
      <button type="button" class="back" id="logQueueBack" aria-label="กลับ"><svg viewBox="0 0 8 14"><path d="M6.5 1.5L1.5 7l5 5.5"/></svg></button>
      <h2 class="set-title">รายการรอส่ง</h2>
    </header>
    <div class="set-stack" id="logQueueList"></div>
  </section>

  <!-- ช่องสั่งงาน -->
  <div class="answer" id="answer" role="status" hidden></div>
  <form class="cmd glass" id="cmd" autocomplete="off">
    <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <input id="cmdInput" type="text" enterkeyhint="go" placeholder="สั่งงาน เช่น เงินเหลือเท่าไหร่" aria-label="สั่งงาน">
    <button type="button" class="mic" id="micBtn" aria-label="พูดคำสั่ง">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </form>

  <!-- หน้าซิงก์ตอนเปิดแอป -->
  <section class="overlay sync" id="sync" aria-label="กำลังซิงก์" hidden>
    <div class="hud-top mono"><span class="live warn"><i></i><b>ALPHA · SYNCING</b></span><span id="syncCount"></span></div>
    <span class="alpha alpha-xl spinning" aria-hidden="true"><i class="glow-orb"></i><i class="ring r1"></i><span class="char"><img src="/assets/alpha-character.png" alt="" draggable="false"><i class="shirt"></i></span><i class="ring r2"></i><i class="spark s1"></i><i class="spark s2"></i></span>
    <h2>กำลังเชื่อมต่อข้อมูล…</h2>
    <p id="syncSub">ดึงข้อมูลล่าสุดจากทุกแอป</p>
    <div class="glass mono sync-log" id="syncLog"></div>
    <div id="syncIssues"></div>
    <button type="button" class="skip" id="syncSkip">ข้าม ›</button>
  </section>

  <!-- หน้ารายงาน -->
  <section class="overlay report" id="report" aria-label="รายงาน" hidden>
    <header class="rp-head">
      <button type="button" class="back" id="reportBack" aria-label="กลับ"><svg viewBox="0 0 8 14"><path d="M6.5 1.5L1.5 7l5 5.5"/></svg></button>
      <span class="avatar" id="rpAvatar" aria-hidden="true"><span class="char"><img src="/assets/alpha-character.png" alt="" draggable="false"><i class="shirt"></i></span></span>
      <div class="rp-title"><b class="mono">ALPHA</b><small class="mono" id="rpState"></small></div>
      <button type="button" class="speak" id="speakBtn" aria-label="อ่านให้ฟัง">
        <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
    </header>
    <div class="rp-body mono" id="rpBody"></div>
  </section>

  <!-- หน้าตั้งค่า -->
  <section class="overlay settings" id="settings" aria-label="ตั้งค่า" hidden>
    <header class="rp-head">
      <button type="button" class="back" id="settingsBack" aria-label="กลับ"><svg viewBox="0 0 8 14"><path d="M6.5 1.5L1.5 7l5 5.5"/></svg></button>
      <h2 class="set-title" id="setTitle"></h2>
    </header>
    <div class="set-label" id="themeLabel"></div>
    <div class="themes" id="themes" role="radiogroup"></div>
    <div class="set-label" id="modeLabel"></div>
    <div class="seg three" id="modeSeg" role="radiogroup">
      <button type="button" role="radio" data-mode="auto"></button>
      <button type="button" role="radio" data-mode="light"></button>
      <button type="button" role="radio" data-mode="dark"></button>
    </div>
    <div class="set-label" id="langLabel"></div>
    <div class="seg" id="langSeg" role="radiogroup">
      <button type="button" role="radio" data-lang="th">ไทย</button>
      <button type="button" role="radio" data-lang="en">English</button>
    </div>
    <div class="set-label" id="connLabel"></div>
    <div class="set-stack" id="conns"></div>
    <div class="set-label" id="alertLabel"></div>
    <div class="glass set-card" style="margin-top:0">
      <label class="set-row" for="paceMin"><span id="paceLabel"></span>
        <input id="paceMin" type="number" inputmode="numeric" min="0" step="50"></label>
      <p class="set-hint" id="paceHint"></p>
      <div class="toggle-row" style="margin-top:14px"><span id="briefLabel"></span><button type="button" class="switch" id="briefSwitch" role="switch" aria-checked="true" aria-labelledby="briefLabel"></button></div>
      <p class="set-hint" id="briefHint"></p>
    </div>
    <div class="set-label" id="speechLabel"></div>
    <div class="glass set-card" style="margin-top:0">
      <label class="set-row" for="tightPerDay"><span id="tightLabel"></span>
        <input id="tightPerDay" type="number" inputmode="numeric" min="0" step="10"></label>
      <label class="set-row" for="overMid" style="margin-top:10px"><span id="overMidLabel"></span>
        <input id="overMid" type="number" inputmode="numeric" min="0" step="50"></label>
      <label class="set-row" for="overHigh" style="margin-top:10px"><span id="overHighLabel"></span>
        <input id="overHigh" type="number" inputmode="numeric" min="0" step="100"></label>
      <p class="set-hint" id="speechHint"></p>
    </div>
    <div class="set-label">จดรายรับรายจ่ายจากช่องสั่งงาน</div>
    <div class="glass set-card" style="margin-top:0">
      <label class="set-col" for="logUrl"><span>URL เขียนชีต (เว้นว่าง = ใช้ลิงก์เดียวกับ Finance)</span>
        <input id="logUrl" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label class="set-col" for="logToken" style="margin-top:10px"><span>รหัสเชื่อม (HUB_TOKEN)</span>
        <input id="logToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label class="set-row" for="lateCutoff" style="margin-top:10px"><span>ไม่ระบุวัน ก่อนกี่โมงให้ถือเป็นของเมื่อวาน (0 = ปิด)</span>
        <input id="lateCutoff" type="number" inputmode="numeric" min="0" max="12" step="1"></label>
      <p class="set-hint">ค่าน้ำมันกับรูดบัตรไม่จดตรงนี้ · ทุกรายการต้องกดยืนยันก่อนจด</p>
      <div class="set-label" style="margin:14px 0 6px">คำที่ Alpha จำไว้</div>
      <div id="learnedList" class="learned"></div>
    </div>
    <div class="set-label" id="voiceLabel"></div>
    <div class="glass rp-voice">
      <div class="seg" id="voiceSeg" role="radiogroup">
        <button type="button" role="radio" data-voice="device"></button>
        <button type="button" role="radio" data-voice="siri"></button>
      </div>
      <p id="voiceNote"></p>
      <button type="button" class="voice-test" id="voiceTest"></button>
    </div>
    <p class="set-hint" style="text-align:center;margin:24px 0 8px" id="setFoot"></p>
  </section>

  <script type="module" src="/hub.js"></script>
</body>
</html>
