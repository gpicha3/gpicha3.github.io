<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6FC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Alpha">
  <meta name="description" content="รวมแอปส่วนตัว พร้อมสรุปและแจ้งเตือนจากทุกแอป">
  <title>Alpha</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/soft.css">
  <script src="/alpha-theme.js"></script>
  <!-- หน้า Alpha ใช้ธีม Soft Indigo เสมอ (ธีมสี 6 ชุดใช้กับ Fuel Logger / Finance) · ใช้แค่โหมดสว่าง/มืด
       แถบสถานะ iPhone ให้ตรงกับพื้นหลังของ Soft Indigo -->
  <script>(function () {
    var T = window.AlphaTheme, apply = T.apply;
    function soft() {
      var dark = T.isDark(), m = document.querySelector('meta[name="theme-color"]'), sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (m) m.content = dark ? '#12121A' : '#F7F6FC';
      if (sb) sb.content = dark ? 'black-translucent' : 'default';
    }
    T.apply = function () { apply(); soft(); };
    soft();
    try { var c = JSON.parse(localStorage.getItem('alpha.character') || 'null'); if (c && c.float === false) document.documentElement.classList.add('no-float'); if (c && c.blink === false) document.documentElement.classList.add('no-blink'); } catch (e) {}
  })();</script>
  <!-- หน้า welcome ต้องขึ้นตั้งแต่เฟรมแรก (ไม่เห็นหน้าแรกแวบก่อน): ทุกครั้งที่เปิดแอปใหม่ (sessionStorage ว่าง)
       กลับจากแอปลูกในหน้าต่างเดิม / สลับแอปแล้วกลับมา = session เดิม ไม่โชว์ · #report / #settings ไม่โชว์ -->
  <script>try { if (!sessionStorage.getItem('hub.session') && !/^#(report|settings)$/.test(location.hash)) document.documentElement.classList.add('welcome'); } catch (e) { /* ไม่มี storage = ไม่โชว์ */ }</script>
  <!-- โหลดทุกไฟล์ที่ hub ต้องใช้พร้อมกันตั้งแต่ต้น (ไม่ต้องรอทีละชั้น) -->
  <link rel="modulepreload" href="/hub.js">
  <link rel="modulepreload" href="/config.js">
  <link rel="modulepreload" href="/commands.js">
  <link rel="modulepreload" href="/messages.js">
  <link rel="modulepreload" href="/speech.js">
  <link rel="modulepreload" href="/icons.js">
  <link rel="modulepreload" href="/alpha-character.js">
  <link rel="modulepreload" href="/log/parse.js">
  <link rel="modulepreload" href="/log/categories.js">
  <link rel="modulepreload" href="/log/card.js">
  <link rel="modulepreload" href="/log/sheet.js">
  <link rel="modulepreload" href="/finance-app/summary.js">
  <link rel="modulepreload" href="/finance-app/calc.js">
  <link rel="modulepreload" href="/finance-app/api.js">
  <link rel="modulepreload" href="/fuel-logger/summary.js">
  <link rel="modulepreload" href="/fuel-logger/core.js">
  <link rel="preload" href="/messages/th.json" as="fetch" crossorigin>
  <link rel="preload" href="/data/categoryWords.th.json" as="fetch" crossorigin>
</head>
<body>
  <!-- หน้าแรก -->
  <main class="home" id="home">
    <div class="home-scroll" id="homeScroll">
      <div class="top">
        <div class="me">
          <span id="meBot"></span>
          <div><small id="greet">สวัสดี</small><b><i class="live-dot" id="chatDot" hidden></i>Alpha Online</b></div>
        </div>
        <div class="top-btns">
          <button type="button" class="circle" id="modeBtn" aria-label="สลับสว่าง/มืด"></button>
          <button type="button" class="circle" id="settingsBtn" aria-label="ตั้งค่า"></button>
        </div>
      </div>

      <h1 class="hello" id="hello"></h1>

      <!-- สรุปประจำวัน: แตะแล้วเปิดข้อความเต็ม -->
      <button type="button" class="brief" id="brief" aria-haspopup="dialog">
        <span class="brief-text">
          <span class="pill-tag"><i></i>สรุปประจำวัน • Daily Brief</span>
          <h3 id="briefTitle">กำลังโหลด…</h3>
          <p id="briefText"></p>
          <span class="more" id="briefMore" hidden>แตะเพื่ออ่านทั้งหมด</span>
        </span>
        <span id="briefBot"></span>
      </button>

      <section id="usage" hidden>
        <div class="sec-head"><h3>การใช้งานสัปดาห์นี้ (Usage)</h3><span id="usageReset"></span></div>
        <div class="gauges" style="margin-top:18px">
          <div class="card gauge" id="gWeek" style="--c:var(--brand)"></div>
          <div class="card gauge" id="gFive" style="--c:var(--pink)"></div>
        </div>
      </section>

      <section id="alertSec" hidden>
        <div class="sec-head"><h3>แจ้งเตือน</h3><span id="alertCount"></span></div>
        <div class="alerts" id="alerts" aria-live="polite" style="margin-top:18px"></div>
      </section>
      <div id="offline"></div>
      <button type="button" class="log-pending" id="logPending" hidden></button>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="เมนู"></nav>
  </main>

  <!-- สรุปประจำวันแบบเต็ม: พื้นหลังเบลอ การ์ดกลางจอ ตัวละครด้านบน -->
  <div class="pop" id="briefPop" hidden>
    <div class="pop-card" role="dialog" aria-modal="true" aria-labelledby="popTitle">
      <span id="popBot"></span>
      <span class="pill-tag"><i></i>สรุปประจำวัน • Daily Brief</span>
      <h3 id="popTitle"></h3>
      <div class="pop-body" id="popBody"></div>
      <div class="pop-actions">
        <button type="button" class="btn ghost" id="popListen">ฟังสรุป</button>
        <button type="button" class="btn primary" id="popClose">รับทราบค่ะ</button>
      </div>
    </div>
  </div>

  <!-- จดรายรับรายจ่าย: การ์ดยืนยัน · แถบเลิกทำ · รายการรอส่ง -->
  <div class="answer" id="answer" role="status" hidden></div>
  <div class="log-layer" id="logCard" hidden></div>
  <div class="log-undo glass" id="logUndo" hidden><span id="logUndoText"></span><button type="button" id="logUndoBtn">เลิกทำ</button></div>
  <section class="overlay log-queue" id="logQueue" aria-label="รายการรอส่ง" hidden>
    <header class="rp-head">
      <button type="button" class="back" id="logQueueBack" aria-label="กลับ"></button>
      <h2 class="set-title">รายการรอส่ง</h2>
    </header>
    <div class="set-stack" id="logQueueList"></div>
  </section>

  <!-- หน้า welcome (HUD): ครั้งแรกของวัน หรือตอนไม่มี cache · แตะเพื่อข้าม -->
  <section class="sync" id="sync" aria-label="กำลังเชื่อมต่อ" hidden>
    <svg class="hud-grid" aria-hidden="true" width="100%" height="100%"><defs><pattern id="hudGrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="currentColor" stroke-width=".5"/></pattern></defs><rect width="100%" height="100%" fill="url(#hudGrid)"/></svg>
    <div class="hud-scan" aria-hidden="true"></div>
    <div class="hud-body">
      <div class="hud-ring" aria-hidden="true">
        <svg class="spin" viewBox="0 0 200 200"><circle cx="100" cy="100" r="94" fill="none" stroke="#9a6cff" stroke-width="2" stroke-dasharray="60 14 6 14"/></svg>
        <svg class="spin rev" viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="none" stroke="#d9b8ff" stroke-width="5" stroke-dasharray="2 6" opacity=".7"/></svg>
        <svg class="spin fast" viewBox="0 0 200 200"><circle cx="100" cy="100" r="66" fill="none" stroke="#f3e8ff" stroke-width="2.5" stroke-dasharray="90 325" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 200 200"><g stroke="#9a6cff" stroke-width="2"><line x1="100" y1="2" x2="100" y2="12"/><line x1="198" y1="100" x2="188" y2="100"/><line x1="100" y1="198" x2="100" y2="188"/><line x1="2" y1="100" x2="12" y2="100"/></g></svg>
        <span class="hud-core mono">ALPHA</span>
      </div>
      <div class="hud-bar"><i id="syncBar"></i></div>
      <div class="hud-log mono" id="syncLog"></div>
      <div class="hud-welcome" id="syncWelcome" aria-live="polite"></div>
      <div id="syncIssues"></div>
    </div>
    <button type="button" class="hud-skip mono" id="syncSkip">แตะเพื่อข้าม</button>
  </section>

  <!-- หน้ารายงาน -->
  <section class="overlay report" id="report" aria-label="รายงาน" hidden>
    <header class="rp-head">
      <button type="button" class="back" id="reportBack" aria-label="กลับ"></button>
      <span class="rp-avatar" id="rpAvatar"></span>
      <div class="rp-title"><b>น้องอัล</b><small id="rpState"></small></div>
      <button type="button" class="speak" id="speakBtn" aria-label="อ่านให้ฟัง"></button>
    </header>
    <div class="rp-body" id="rpBody"></div>
  </section>

  <!-- หน้าตั้งค่า -->
  <section class="overlay settings" id="settings" aria-label="ตั้งค่า" hidden>
    <header class="rp-head set-head">
      <button type="button" class="back" id="settingsBack" aria-label="กลับ"></button>
      <h2 class="set-title" id="setTitle"></h2>
    </header>

    <div class="set-label">ตัวละคร</div>
    <div class="set-card studio" id="studio">
      <div class="seg three" id="charRoom" role="radiogroup" aria-label="ห้อง"></div>
      <div class="stage" id="charStage"></div>
      <span class="row-lbl">สี</span>
      <div class="swatches" id="charColors" role="radiogroup" aria-label="สี"></div>
      <span class="row-lbl">ดวงตา</span>
      <div class="eyes-pick" id="charEyes" role="radiogroup" aria-label="ดวงตา"></div>
      <div>
        <div class="toggle-row"><span id="floatLabel">ลอยขึ้นลง</span><button type="button" class="switch" id="floatSwitch" role="switch" aria-checked="true" aria-labelledby="floatLabel"></button></div>
        <div class="toggle-row"><span id="blinkLabel">กะพริบตา</span><button type="button" class="switch" id="blinkSwitch" role="switch" aria-checked="true" aria-labelledby="blinkLabel"></button></div>
      </div>
      <p class="set-hint" id="charHint" style="margin:0"></p>
    </div>

    <div class="set-label" id="modeLabel"></div>
    <div class="seg three" id="modeSeg" role="radiogroup">
      <button type="button" role="radio" data-mode="auto"></button>
      <button type="button" role="radio" data-mode="light"></button>
      <button type="button" role="radio" data-mode="dark"></button>
    </div>
    <div class="set-label" id="themeLabel"></div>
    <div class="themes" id="themes" role="radiogroup"></div>
    <div class="set-label" id="langLabel"></div>
    <div class="seg" id="langSeg" role="radiogroup">
      <button type="button" role="radio" data-lang="th">ไทย</button>
      <button type="button" role="radio" data-lang="en">English</button>
    </div>
    <div class="set-label" id="connLabel"></div>
    <div class="set-stack" id="conns"></div>
    <div class="set-label" id="alertLabel"></div>
    <div class="set-card">
      <label class="set-row" for="paceMin"><span id="paceLabel"></span>
        <input id="paceMin" type="number" inputmode="numeric" min="0" step="50"></label>
      <p class="set-hint" id="paceHint"></p>
      <div class="toggle-row" style="margin-top:14px"><span id="briefLabel"></span><button type="button" class="switch" id="briefSwitch" role="switch" aria-checked="true" aria-labelledby="briefLabel"></button></div>
      <p class="set-hint" id="briefHint"></p>
    </div>
    <div class="set-label" id="speechLabel"></div>
    <div class="set-card">
      <label class="set-row" for="tightPerDay"><span id="tightLabel"></span>
        <input id="tightPerDay" type="number" inputmode="numeric" min="0" step="10"></label>
      <label class="set-row" for="overMid" style="margin-top:10px"><span id="overMidLabel"></span>
        <input id="overMid" type="number" inputmode="numeric" min="0" step="50"></label>
      <label class="set-row" for="overHigh" style="margin-top:10px"><span id="overHighLabel"></span>
        <input id="overHigh" type="number" inputmode="numeric" min="0" step="100"></label>
      <p class="set-hint" id="speechHint"></p>
    </div>
    <div class="set-label" id="voiceLabel"></div>
    <div class="rp-voice">
      <div class="seg" id="voiceSeg" role="radiogroup">
        <button type="button" role="radio" data-voice="device"></button>
        <button type="button" role="radio" data-voice="siri"></button>
      </div>
      <p id="voiceNote"></p>
      <button type="button" class="voice-test" id="voiceTest"></button>
    </div>
    <p class="set-hint" style="text-align:center;margin:24px 0 8px" id="setFoot"></p>
  </section>

  <script type="module" src="/hub.js"></script>
</body>
</html>
