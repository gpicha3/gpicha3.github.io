<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F3F3F7">
<title>แชต · Alpha</title>
<script src="/alpha-theme.js"></script>
<!--
  แชตกับน้องอัล (บอทบน PC) ฝังผ่าน iframe
  - หน้าแชตตัวจริงอยู่ที่ repo alpha (app/) เสิร์ฟผ่าน Tailscale https บน PC → ต่อได้เฉพาะเครื่องที่อยู่ใน tailnet ของบอส
  - ที่อยู่แชตเก็บในเครื่องนี้ (localStorage "chat.url") ไม่ฝังในโค้ด เพราะ repo นี้เปิดสาธารณะ
  - PC ปิด / มือถือไม่ได้ต่อ Tailscale → ขึ้น "ออฟไลน์" หน้าอื่นของ hub ไม่กระทบ
-->
<style>
  /* ธีม Soft Indigo เดียวกับหน้า Alpha (สว่าง/มืดตาม alpha-theme.js) */
  :root{--bg:#F3F3F7;--ink:#18181B;--dim:#8E8BA3;--line:rgba(30,27,75,.08);--surface:#fff;--brand:#5448C8;color-scheme:light}
  :root[data-alpha-mode="dark"]{--bg:#121219;--ink:#F4F4F5;--dim:#8A879E;--line:rgba(255,255,255,.08);--surface:#1B1A2B;--brand:#7C72F0;color-scheme:dark}
  *{box-sizing:border-box;margin:0}
  html,body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"SF Pro Text","Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif}
  /* iPhone home-screen app (translucent status bar): the page comes up one status-bar short at the bottom unless
     the document is that much taller (same fix as the hub's styles.css) · body pinned to all four edges */
  html{min-height:calc(100% + env(safe-area-inset-top))}
  body{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
  .bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 16px) 12px 8px;border-bottom:1px solid var(--line);flex:none}
  .bar a,.bar button{display:inline-flex;align-items:center;gap:6px;color:var(--brand);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:99px;font:inherit;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer}
  .bar h1{flex:1;font-size:16px;font-weight:600;text-align:center}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:1px}
  .dot.on{background:#22C55E}.dot.off{background:#EF4444}
  main{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  .panel{position:absolute;inset:0;display:grid;place-content:center;gap:12px;padding:24px;text-align:center;color:var(--dim)}
  .panel b{color:var(--ink);font-size:17px}
  .panel input{width:min(420px,86vw);font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .panel button{font:inherit;font-weight:600;color:#fff;background:var(--brand);border:0;border-radius:99px;padding:10px 22px;cursor:pointer;justify-self:center}
  .panel small{font-size:12px;line-height:1.5;max-width:420px}
  [hidden]{display:none!important}
  /* แชตต่อได้แล้ว: ซ่อนแถบนี้ ให้หน้าแชตเต็มจอ (หน้าแชตมีปุ่มกลับ Hub และเผื่อแถบสถานะ iPhone เอง) */
  body.full .bar{display:none}
  .panel .link{justify-self:center;color:var(--brand);font-size:13px;font-weight:600;text-decoration:none;padding:4px 10px}
  .panel .go{justify-self:center;font-weight:600;color:#fff;background:var(--brand);border-radius:99px;padding:10px 22px;text-decoration:none}
</style>
</head>
<body>
<header class="bar">
  <a href="/" aria-label="กลับ Hub">‹ Hub</a>
  <h1><span class="dot" id="dot"></span>น้องอัล</h1>
  <a href="/#settings">ตั้งค่า</a>
</header>
<main>
  <iframe id="frame" title="แชตน้องอัล" allow="clipboard-write" hidden></iframe>
  <div class="panel" id="msg"><b>กำลังเชื่อมต่อ…</b></div>
</main>
<script>
(() => {
  // Page size on iPhone:
  // - home-screen app: the page can come up shorter than the screen (status-bar bug) → use the real screen height
  // - keyboard up: iOS doesn't tell the chat inside the iframe, so this page follows the visible area
  //   (visualViewport) and the iframe shrinks to sit right above the keyboard
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const vv = window.visualViewport;
  function screenH() {
    if (!standalone || !screen.height) return innerHeight;
    const portrait = innerHeight >= innerWidth;
    return Math.max(innerHeight, portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height));
  }
  function fitScreen() {
    const s = document.body.style;
    const kb = vv && innerHeight - vv.height > 120;   // keyboard (or another panel) covers the bottom
    if (kb) { s.top = vv.offsetTop + 'px'; s.bottom = 'auto'; s.height = vv.height + 'px'; }
    else {
      const h = screenH();
      s.top = ''; s.bottom = h > innerHeight ? 'auto' : ''; s.height = h > innerHeight ? h + 'px' : '';
    }
  }
  fitScreen();
  addEventListener('resize', fitScreen);
  addEventListener('orientationchange', () => setTimeout(fitScreen, 300));
  if (vv) { vv.addEventListener('resize', fitScreen); vv.addEventListener('scroll', fitScreen); }
  // iOS scrolls the whole page when the keyboard opens: keep it at the top (the body is fixed anyway)
  addEventListener('scroll', () => { if (scrollY) scrollTo(0, 0); }, { passive: true });

  // the chat uses the hub's light/dark (unless a mode was picked inside the chat's own settings)
  const hubMode = () => (window.AlphaTheme && window.AlphaTheme.isDark() ? 'dark' : 'light');
  const chatSrc = url => url + (url.includes('?') ? '&' : '?') + 'hub=' + hubMode();

  const KEY = 'chat.url';
  const $ = id => document.getElementById(id);
  const get = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  let state = '';

  function show(which, text) {
    $('frame').hidden = which !== 'frame';
    $('msg').hidden = which !== 'msg';
    document.body.classList.toggle('full', which === 'frame');
    if (text) $('msg').innerHTML = text;
  }
  // reachable? a no-cors request to a tiny file: resolves when the PC answers, rejects when offline / not on the tailnet
  async function online(url) {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 4000);
    try { await fetch(new URL('icon.svg', url) + '?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: ctl.signal }); return true; }
    catch (e) { return false; } finally { clearTimeout(t); }
  }
  async function connect() {
    const url = get();
    // ที่อยู่หน้าแชตตั้งที่หน้าตั้งค่าของ Alpha (การเชื่อมต่อ → แชตน้องอัล) ที่เดียว
    if (!url) { state = 'setup'; $('dot').className = 'dot'; show('msg', '<b>ยังไม่ได้ตั้งที่อยู่หน้าแชต</b><small>ใส่ที่อยู่จาก Tailscale บน PC ที่หน้าตั้งค่าของ Alpha<br>หมวดการเชื่อมต่อ → แชตน้องอัล</small><a class="go" href="/#settings">ไปหน้าตั้งค่า</a>'); return; }
    if (state === 'frame') return;
    show('msg', '<b>กำลังเชื่อมต่อ…</b>');
    if (await online(url)) {
      state = 'frame'; $('dot').className = 'dot on';
      if ($('frame').src !== chatSrc(url)) $('frame').src = chatSrc(url);
      show('frame');
    } else {
      state = 'off'; $('dot').className = 'dot off';
      show('msg', '<b>แชตออฟไลน์</b><small>PC ปิดอยู่ หรือเครื่องนี้ไม่ได้ต่อ Tailscale<br>ส่วนอื่นของ Hub ใช้ได้ตามปกติ</small><button id="retry">ลองใหม่</button><a class="link" href="/#settings">เปลี่ยนที่อยู่หน้าแชต</a>');
      $('retry').onclick = connect;
    }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && state === 'off') connect(); });
  connect();
})();
</script>
</body>
</html>
